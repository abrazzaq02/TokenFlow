# Netlify configuration for TokenFlow.
# - Frontend: React/Vite app in ./frontend, published from frontend/dist
# - Backend:  Netlify Function netlify/functions/api.mjs, mounted at /api/* via its
#             `config.path`, storing data in Netlify Blobs (no external database).

[build]
  base = "."
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Serve the SPA from the site root (GitHub Pages builds keep /TokenFlow/).
  VITE_BASE = "/"
  # Use the real API (served by the function on the same origin).
  VITE_APP_MODE = "api"
  VITE_API_URL = "/api"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm --prefix frontend run dev -- --port 5173 --strictPort"
  targetPort = 5173
  port = 8888

# Client-side routes (/track/:id, /admin, ...) fall back to the SPA shell.
# /api/* never reaches this rule: the api function's path takes precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
